name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["LICENSE", "NOTICE", ".gitignore"]
  pull_request:
    paths-ignore: ["LICENSE", "NOTICE", ".gitignore"]

jobs:
  # The suite mocks the robot at its boundary and imports no zenoh, so it needs
  # neither a router nor hardware to run here.
  test:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Lint
        run: uv run --extra dev ruff check .

      - name: Test
        run: uv run --extra dev pytest
