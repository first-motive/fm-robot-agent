# fm-robot-agent — the host-side agent that makes a robot a First Motive device.
#
# Its own uv project, not a workspace member: it runs on the robot's host beside
# the vendor's stack, outside any ROS environment, and rosdep has no zenoh
# package to give it.
#
# The zenoh wheel is pinned to the same 1.9.x line as fm-comms' zenoh/zenoh.version.
# An agent that speaks a different protocol version than the router is exactly the
# split the single pin exists to prevent.

[project]
name = "fm-robot-agent"
version = "0.1.0"
description = "Serve a First Motive robot's control verbs over Zenoh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "First Motive", email = "nish@ubundi.co.za" }]
dependencies = [
    "eclipse-zenoh>=1.9.0,<1.10",
    # The Anvil webapp speaks tRPC over a WebSocket and nothing else, and the
    # standard library has no WebSocket client. This is the smallest one that
    # offers a synchronous API, which is what the agent needs.
    "websockets>=13",
]

[project.scripts]
fm-robot-agent = "fm_robot_agent.service:main"
# The CLI half. `fm robot` reaches it through scripts/run/robot.sh.
fm-robot = "fm_robot_agent.client:main"


[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fm_robot_agent"]

[tool.ruff]
# agent/ is the HTTP agent imported verbatim off the devbox as provenance. It is
# deleted once the Zenoh agent replaces it; linting a frozen copy only produces
# findings nobody may act on.
exclude = ["agent"]
